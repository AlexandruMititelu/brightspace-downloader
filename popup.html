<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 12px; font: 13px system-ui, sans-serif; color-scheme: light dark; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  label { display: block; margin: 8px 0 2px; }
  input { width: 100%; box-sizing: border-box; padding: 4px; }
  button { width: 100%; margin-top: 10px; padding: 6px; }
  #status { white-space: pre-wrap; overflow-wrap: anywhere; }
  details { margin-top: 8px; }
</style>
<h1 id="course">…</h1>
<label for="folder">Folder inside Downloads (empty = default)</label>
<input id="folder">
<button id="go" disabled>Download course</button>
<p id="status" role="status"></p>
<details>
  <summary>Settings</summary>
  <label for="base">Default folder inside Downloads</label>
  <input id="base">
</details>
<script type="module" src="popup.js"></script>
